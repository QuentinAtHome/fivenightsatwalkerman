<!DOCTYPE html>
<html>
<head>
<title>Record Label Night</title>

<style>
body {
    margin: 0;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* HUD */

#hud {
    height: 70px;
    background: #111;
    border-bottom: 3px solid #555;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 30px;
    font-size: 28px;
}


/* Office */

#office {
    height: calc(100vh - 70px);
    background: #302020;
    position: relative;
    text-align: center;
}


#wall {
    position:absolute;
    top:50px;
    left:20%;
    width:60%;
    height:300px;
    background:#4b3030;
    border:5px solid #111;
}


#table {
    position:absolute;
    bottom:160px;
    left:35%;
    width:30%;
    height:80px;
    background:#704020;
    border:5px solid black;
}


.door {
    position:absolute;
    bottom:0;
    width:120px;
    height:300px;
    background:#222;
    border:5px solid #777;
    transition:.3s;
}


.closed {
    background:#ddd;
}


#leftDoor {
    left:20px;
}


#rightDoor {
    right:20px;
}



/* Buttons */

button {
    background:#333;
    color:white;
    border:2px solid white;
    padding:15px;
    font-size:18px;
    cursor:pointer;
}


#controls {
    position:absolute;
    bottom:30px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:20px;
}



/* Camera */

#cameraScreen {
    display:none;
    background:#050505;
    width:100%;
    height:calc(100vh - 70px);
    position:absolute;
    top:70px;
}


#map {
    width:700px;
    height:500px;
    margin:auto;
    margin-top:40px;
    position:relative;
    background:#222;
    border:5px solid white;
}


.room {
    position:absolute;
    background:#555;
    border:3px solid white;
    padding:20px;
    cursor:pointer;
}


#lobby {
    top:200px;
    left:50px;
}

#hall {
    top:200px;
    left:280px;
}

#studio {
    top:50px;
    left:280px;
}

#mixing {
    top:350px;
    left:280px;
}

#leftHall {
    top:200px;
    right:50px;
}


#cameraView {
    display:none;
    text-align:center;
    font-size:30px;
    margin-top:50px;
}


</style>

</head>


<body>


<div id="game">


<div id="hud">

<div id="time">
12:00 AM
</div>

<div id="power">
POWER: 100%
</div>

</div>



<div id="office">


<div id="wall"></div>

<div id="table"></div>


<div id="leftDoor" class="door"></div>

<div id="rightDoor" class="door"></div>


<div id="controls">

<button onclick="toggleDoor('leftDoor')">
LEFT DOOR
</button>

<button onclick="openCamera()">
CAMERA
</button>

<button onclick="toggleDoor('rightDoor')">
RIGHT DOOR
</button>

</div>


</div>





<div id="cameraScreen">


<div id="map">


<div class="room" id="lobby" onclick="showRoom('Lobby')">
Lobby
</div>


<div class="room" id="hall" onclick="showRoom('Main Hall')">
Main Hall
</div>


<div class="room" id="studio" onclick="showRoom('Recording Studio')">
Studio
</div>


<div class="room" id="mixing" onclick="showRoom('Mixing Room')">
Mixing Room
</div>


<div class="room" id="leftHall" onclick="showRoom('Office Hall')">
Office Hall
</div>


</div>



<div id="cameraView"></div>


<button onclick="closeCamera()">
BACK TO OFFICE
</button>


</div>


</div>




<script>

let power = 100;

let doors = {
    leftDoor:false,
    rightDoor:false
};


function toggleDoor(id){

    doors[id] = !doors[id];

    document.getElementById(id)
    .classList.toggle("closed");


}



setInterval(()=>{


let usage = 0;


if(doors.leftDoor)
usage++;

if(doors.rightDoor)
usage++;


power -= usage * .5;


if(power < 0)
power = 0;



document.getElementById("power")
.innerHTML =
"POWER: " + Math.floor(power)+"%";


},1000);





let hour = 0;


setInterval(()=>{


hour++;


if(hour>=6){

document.getElementById("time")
.innerHTML="6:00 AM";

return;

}


let display = hour==0 ? 12 : hour;


document.getElementById("time")
.innerHTML =
display+":00 AM";


},60000);





function openCamera(){

document.getElementById("cameraScreen")
.style.display="block";


document.getElementById("office")
.style.display="none";

}



function closeCamera(){

document.getElementById("cameraScreen")
.style.display="none";


document.getElementById("office")
.style.display="block";


document.getElementById("cameraView")
.style.display="none";


}



function showRoom(room){

let view =
document.getElementById("cameraView");


view.style.display="block";


view.innerHTML =
"CAMERA VIEW:<br>"+room;


}



</script>


</body>
</html>
